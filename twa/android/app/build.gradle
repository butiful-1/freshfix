plugins {
    id 'com.android.application'
}

android {
    namespace 'app.old2new.twa'
    compileSdk 36

    defaultConfig {
        applicationId 'app.old2new.twa'
        // Google Play Billing via the Digital Goods API needs Chrome 101+ on
        // Android 9+; the androidbrowserhelper billing module itself requires
        // API 24 (Android 7.0). Raised from 21 with the 1.2 (versionCode 9) release.
        minSdk 24
        targetSdk 36
        versionCode 10
        versionName '1.2.1'
    }

    signingConfigs {
        release {
            storeFile rootProject.file(System.getenv('KEYSTORE_PATH') ?: 'android.keystore')
            storePassword System.getenv('KEYSTORE_PASS') ?: ''
            keyAlias System.getenv('KEY_ALIAS') ?: 'old2new'
            keyPassword System.getenv('KEYSTORE_PASS') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
    // Play Billing bridge for Trusted Web Activities (Digital Goods API +
    // Payment Request 'https://play.google.com/billing'). 1.2.0 (July 2026)
    // is built on Google Play Billing Library 8.3.0, which satisfies Google's
    // "Billing Library 8 or newer for all app updates after Aug 31, 2026" rule.
    implementation 'com.google.androidbrowserhelper:billing:1.2.0'
    implementation 'com.android.billingclient:billing:8.3.0'
}
